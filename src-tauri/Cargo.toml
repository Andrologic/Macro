[package]
name = "macro"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "macro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = "2"
tauri-plugin-store = "2"

# Core
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Git
git2 = "0.18"
glob = "0.3"
regex = "1"

# File System
notify = "6"
walkdir = "2"

# Indexing (placeholder - will add tree-sitter later)
# tree-sitter = "0.20"

# AI
reqwest = { version = "0.11", features = ["stream", "json"] }
futures = "0.3"
axum = "0.8"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
urlencoding = "2"
portable-pty = "0.8"

# Config
config = "0.13"
tauri-plugin-notification = "2.3.3"

# Utils
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSThread", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep"] }
