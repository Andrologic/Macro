[package]
name = "macro"
version = "0.1.0"
description = "Local-first desktop environment for agentic software work."
authors = ["Andrologic"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Andrologic/Macro"
edition = "2021"
default-run = "macro"
autobins = false

[[bin]]
name = "macro"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
tauri = { version = "=2.10.2", features = ["macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-store = "2"

# Core
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Git
git2 = "0.21"
glob = "0.3"
regex = "1"

# File System
notify = "6"
walkdir = "2"

# AI
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures = "0.3"
axum = "0.8"
tower-http = { version = "0.6.8", features = ["cors"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
flate2 = "1"
tar = "0.4"
urlencoding = "2"
portable-pty = "0.8"

# Config
config = "0.15"
tauri-plugin-notification = "2.3.3"

# Utils
[dev-dependencies]
tempfile = "3"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSGeometry", "NSThread", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
