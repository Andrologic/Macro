# Standalone native tests avoid linking the desktop UI and provider SDKs.
[package]
name = "macro-pilot-capture-tests"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[lib]
path = "harness.rs"
[dependencies]
git2 = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tempfile = "3"
walkdir = "2"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
