# Standalone read-only journal tool, without desktop packaging or provider SDKs.
[package]
name = "macro-agsdl-replay030"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "agsdl_flow030_replay"
path = "../../examples/agsdl_flow030_replay.rs"

[[test]]
name = "replay_cli"
path = "cli.rs"

# Exercise the production reducer without linking the desktop application.
[[test]]
name = "flow_reducer"
path = "../agsdl_flow030.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

# Keep this small diagnostic build independent of desktop debug build locks.
[profile.replay]
inherits = "dev"
debug = 0
incremental = false
