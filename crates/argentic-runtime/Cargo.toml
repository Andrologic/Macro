[package]
name = "argentic-runtime"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Owned AgSDL execution with embedded SQLite"

[features]
editor-parity = []
dev-support = []
agsdl-engine-qa = []
agsdl-content-qa = []

[dependencies]
tempfile = "3"
argentic-core = { version = "0.1.0", path = "../argentic-core" }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
schemars = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures = "0.3"
async-trait = "0.1"
semver = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
thiserror = "2"
url = "2"
serde_yaml = "0.9"
unicode-normalization = "0.1"
tracing = "0.1"
portable-pty = "0.8"
cap-std = "=4.0.3"
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Wdk_System_SystemInformation"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[build-dependencies]
serde_json = "1"

[[test]]
name = "approval_boundary"
required-features = ["dev-support"]

[workspace]
resolver = "2"
