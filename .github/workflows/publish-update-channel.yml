name: Publish update channel

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: update-channel-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Stable manifests
    if: github.event.release.prerelease == false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted workflow tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download updater manifest and create channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p channel-output
          gh release download "$TAG" --pattern latest.json --dir channel-input
          bun dev/release/verify-updater.mjs --manifest channel-input/latest.json
          bun dev/release/channel-manifests.mjs \
            --manifest channel-input/latest.json \
            --channel stable \
            --output channel-output

      - name: Advance audited channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" channel-repository
          cd channel-repository
          if git show-ref --verify --quiet refs/remotes/origin/updates; then
            git switch --track origin/updates
          else
            git switch --orphan updates
            git rm -rf .
          fi
          mkdir -p channels
          cp ../channel-output/*.json channels/
          git add channels
          if git diff --cached --quiet; then
            echo "Channel manifests already point to ${TAG}."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(updates): advance stable to ${TAG}"
          git push origin HEAD:updates
