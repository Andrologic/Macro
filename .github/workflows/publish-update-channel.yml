name: Publish update channel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to republish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-channel-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Stable manifests
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted workflow tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Validate published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable channel tags must use vX.Y.Z; found ${TAG}."
            exit 1
          fi

          RELEASE_STATE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [[ "$RELEASE_STATE" != $'false\tfalse' ]]; then
            echo "::error::${TAG} must be a published stable release."
            exit 1
          fi

          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "::error::Stable release tag ${TAG} must be annotated."
            exit 1
          fi
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Stable release tag ${TAG} is not contained in origin/main."
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Download updater manifest and create channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p channel-output
          gh release download "$TAG" --dir channel-input
          bun dev/release/verify-updater.mjs \
            --manifest channel-input/latest.json \
            --asset-root channel-input \
            --checksums channel-input/SHA256SUMS.txt
          MANIFEST_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('channel-input/latest.json', 'utf8')).version")"
          if [[ "$TAG" != "v${MANIFEST_VERSION}" ]]; then
            echo "::error::Release tag ${TAG} does not match updater manifest version ${MANIFEST_VERSION}."
            exit 1
          fi
          bun dev/release/channel-manifests.mjs \
            --manifest channel-input/latest.json \
            --channel stable \
            --output channel-output
          bun dev/release/verify-channel-manifests.mjs \
            --directory channel-output \
            --channel stable \
            --version "$MANIFEST_VERSION" \
            --tag "$TAG"

      - name: Advance audited channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" channel-repository
          bun dev/release/publish-channel-branch.mjs \
            --repository channel-repository \
            --manifests channel-output \
            --channel stable \
            --label "$TAG"
