name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      pub_date: ${{ steps.meta.outputs.pub_date }}
    steps:
      - name: Reject tag updates and deletions
        env:
          TAG_CREATED: ${{ github.event.created }}
          TAG_DELETED: ${{ github.event.deleted }}
        run: |
          if [[ "$TAG_CREATED" != "true" || "$TAG_DELETED" == "true" ]]; then
            echo "::error::Releases only accept newly created immutable tags."
            exit 1
          fi

      - name: Check out tagged commit and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch annotated release tag
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Verify stable tag, main ancestry, and release availability
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release versions must be stable x.y.z versions; found ${VERSION}."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match application version ${VERSION}."
            exit 1
          fi

          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::Expected immutable tag ${TAG} is missing."
            exit 1
          }

          if [[ "$(git cat-file -t "$TAG")" != "tag" ]]; then
            echo "::error::Release tag ${TAG} must be an annotated tag."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag ${TAG} resolves to ${TAG_COMMIT}, not event commit ${GITHUB_SHA}."
            exit 1
          fi

          git rev-parse --verify origin/main >/dev/null
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit ${GITHUB_SHA} is not in origin/main history."
            exit 1
          fi

          set +e
          RELEASE_LOOKUP="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --silent 2>&1)"
          RELEASE_LOOKUP_STATUS=$?
          set -e

          if [[ "$RELEASE_LOOKUP_STATUS" -eq 0 ]]; then
            echo "::error::GitHub release ${TAG} already exists."
            exit 1
          fi

          if [[ "$RELEASE_LOOKUP" != *"HTTP 404"* ]]; then
            echo "::error::Unable to verify whether GitHub release ${TAG} already exists."
            printf '%s\n' "$RELEASE_LOOKUP"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Macro ${TAG}" >> "$GITHUB_OUTPUT"
          PUB_DATE="$(git show -s --format=%cI "${TAG}^{commit}")"
          echo "pub_date=${PUB_DATE}" >> "$GITHUB_OUTPUT"

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Run shared release validation profile
        run: bun dev/ci/run-checks.mjs --profile native

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            key: macos
            runner: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: release-macos
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows x64
            key: windows
            arch: x64
            runner: windows-latest
            args: --bundles nsis
            artifact_name: release-windows-x64
            bundle_dir: src-tauri/target/release/bundle/nsis
            main_binary: src-tauri/target/release/macro.exe
            sidecar_binary: src-tauri/binaries/macro-ai-runtime-x86_64-pc-windows-msvc.exe
            pe_machine: '0x8664'
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: Windows ARM64
            key: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            args: --target aarch64-pc-windows-msvc --bundles nsis
            artifact_name: release-windows-arm64
            bundle_dir: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis
            main_binary: src-tauri/target/aarch64-pc-windows-msvc/release/macro.exe
            sidecar_binary: src-tauri/binaries/macro-ai-runtime-aarch64-pc-windows-msvc.exe
            pe_machine: '0xAA64'
            artifact_paths: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            key: linux
            runner: ubuntu-22.04
            args: --verbose --bundles appimage,deb,rpm
            artifact_name: release-linux
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        if: matrix.key != 'macos'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Set up Rust with macOS targets
        if: matrix.key == 'macos'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdk-pixbuf2.0-bin \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Verify Tauri updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Missing required release secret: TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo "::error::Missing required release secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            exit 1
          fi

      - name: Verify Apple signing secrets
        if: matrix.key == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS signing secret: ${name}"
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          NO_STRIP: ${{ matrix.key == 'linux' && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun dev/tauri-cli.mjs
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: false

      - name: Verify macOS bundle and notarization
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.app' -type d | head -n 1)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.dmg' -type f | head -n 1)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          bun ./dev/verify-macos-bundle.mjs --target universal-apple-darwin --app "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_TEAM_ID="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -n 1)"
          if [[ "$SIGNED_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::macOS bundle Team ID ${SIGNED_TEAM_ID:-missing} does not match the authorized Team ID."
            exit 1
          fi
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify unsigned Windows installer
        if: matrix.key == 'windows'
        shell: pwsh
        env:
          WINDOWS_BUNDLE_DIR: ${{ matrix.bundle_dir }}
          MAIN_BINARY_PATH: ${{ matrix.main_binary }}
          SIDECAR_BINARY_PATH: ${{ matrix.sidecar_binary }}
          EXPECTED_PE_MACHINE: ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "PE binary is missing: $Path"
            }
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              return ('0x{0:X4}' -f $reader.ReadUInt16())
            } finally {
              $stream.Dispose()
            }
          }

          foreach ($binary in @($env:MAIN_BINARY_PATH, $env:SIDECAR_BINARY_PATH)) {
            $machine = Get-PeMachine $binary
            if ($machine -ne $env:EXPECTED_PE_MACHINE) {
              throw "$binary has PE machine $machine; expected $env:EXPECTED_PE_MACHINE."
            }
          }

          $installer = Get-ChildItem -LiteralPath $env:WINDOWS_BUNDLE_DIR -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer is missing.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Windows installer was expected to be unsigned for this release channel, but its Authenticode status is $($signature.Status)."
          }
          Write-Host "Windows ${{ matrix.arch }} binaries match $env:EXPECTED_PE_MACHINE. The installer is intentionally not Authenticode-signed; its updater artifact remains cryptographically signed."

      - name: Inspect Linux packages
        if: matrix.key == 'linux'
        run: |
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)"
          RPM_PATH="$(find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"
          test -n "$APPIMAGE_PATH"
          test -n "$DEB_PATH"
          test -n "$RPM_PATH"
          test -x "$APPIMAGE_PATH"
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          rpm --query --list --package "$RPM_PATH"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 2

  draft-release:
    name: Create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged release sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded-artifacts

      - name: Collect release assets and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-assets

          copy_asset() {
            local artifact_directory="$1"
            local pattern="$2"
            local destination="$3"
            local source
            source="$(find "downloaded-artifacts/${artifact_directory}" -type f -name "$pattern" | sort | head -n 1)"
            if [ -z "$source" ]; then
              echo "::error::Missing release asset matching ${artifact_directory}/${pattern}"
              find "downloaded-artifacts/${artifact_directory}" -type f | sort
              exit 1
            fi
            cp "$source" "release-assets/${destination}"
          }

          copy_asset release-macos '*.dmg' "Macro_${VERSION}_macOS_universal.dmg"
          copy_asset release-macos '*.app.tar.gz' "Macro_${VERSION}_macOS_universal.app.tar.gz"
          copy_asset release-macos '*.app.tar.gz.sig' "Macro_${VERSION}_macOS_universal.app.tar.gz.sig"
          copy_asset release-windows-x64 '*.exe' "Macro_${VERSION}_Windows_x64_setup.exe"
          copy_asset release-windows-x64 '*.exe.sig' "Macro_${VERSION}_Windows_x64_setup.exe.sig"
          copy_asset release-windows-arm64 '*.exe' "Macro_${VERSION}_Windows_ARM64_setup.exe"
          copy_asset release-windows-arm64 '*.exe.sig' "Macro_${VERSION}_Windows_ARM64_setup.exe.sig"
          copy_asset release-linux '*.AppImage' "Macro_${VERSION}_Linux_x64.AppImage"
          copy_asset release-linux '*.AppImage.sig' "Macro_${VERSION}_Linux_x64.AppImage.sig"
          copy_asset release-linux '*.deb' "Macro_${VERSION}_Linux_x64.deb"
          copy_asset release-linux '*.rpm' "Macro_${VERSION}_Linux_x64.rpm"

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          CURATED_NOTES="dev/release/notes/${VERSION}.md"
          if [ -s "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" updater-notes.md
          else
            GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="${GITHUB_SHA}" \
              --jq '.body' || true)"

            if [ -n "$GENERATED_NOTES" ]; then
              printf '%s\n' "$GENERATED_NOTES" > updater-notes.md
            else
              echo "No user-facing changes were provided for this release." > updater-notes.md
            fi
          fi

          {
            echo "## Downloads"
            echo
            echo "- macOS Apple Silicon + Intel: \`Macro_${VERSION}_macOS_universal.dmg\`"
            echo "- Windows x64 (not Authenticode-signed): \`Macro_${VERSION}_Windows_x64_setup.exe\`. Windows may display an \`Unknown publisher\` warning during the initial installation."
            echo "- Windows ARM64 (not Authenticode-signed): \`Macro_${VERSION}_Windows_ARM64_setup.exe\`. Windows may display an \`Unknown publisher\` warning during the initial installation."
            echo "- Linux x64: \`Macro_${VERSION}_Linux_x64.AppImage\`, \`Macro_${VERSION}_Linux_x64.deb\`, or \`Macro_${VERSION}_Linux_x64.rpm\`"
            echo "- Automatic updates: \`latest.json\` and the signed updater archives are attached for installed Macro clients."
            echo "- Source code: GitHub automatically attaches source archives to this release."
            echo
            echo "## Checksums"
            echo
            echo "Download \`SHA256SUMS.txt\` to verify release assets."
            echo
            cat updater-notes.md
          } > release-notes.md

      - name: Generate updater manifest and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          PUB_DATE: ${{ needs.validate.outputs.pub_date }}
        run: |
          bun dev/release/updater-manifest.mjs \
            --version "$VERSION" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file updater-notes.md \
            --pub-date "$PUB_DATE" \
            --output release-assets/latest.json \
            --artifact windows-x86_64 \
              "release-assets/Macro_${VERSION}_Windows_x64_setup.exe" \
              "release-assets/Macro_${VERSION}_Windows_x64_setup.exe.sig" \
              "Macro_${VERSION}_Windows_x64_setup.exe" \
            --artifact windows-aarch64 \
              "release-assets/Macro_${VERSION}_Windows_ARM64_setup.exe" \
              "release-assets/Macro_${VERSION}_Windows_ARM64_setup.exe.sig" \
              "Macro_${VERSION}_Windows_ARM64_setup.exe" \
            --artifact linux-x86_64 \
              "release-assets/Macro_${VERSION}_Linux_x64.AppImage" \
              "release-assets/Macro_${VERSION}_Linux_x64.AppImage.sig" \
              "Macro_${VERSION}_Linux_x64.AppImage" \
            --artifact darwin-x86_64 \
              "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz" \
              "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz.sig" \
              "Macro_${VERSION}_macOS_universal.app.tar.gz" \
            --artifact darwin-aarch64 \
              "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz" \
              "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz.sig" \
              "Macro_${VERSION}_macOS_universal.app.tar.gz"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

          bun dev/release/verify-updater.mjs \
            --manifest release-assets/latest.json \
            --asset-root release-assets \
            --checksums release-assets/SHA256SUMS.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --draft \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
