name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Enforce main branch
        if: github.ref_name != 'main'
        run: |
          echo "Releases can only run from main. Current ref is ${GITHUB_REF_NAME}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version and availability
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(bun -e "console.log(require('./package.json').version)")"
          TAG="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Official releases must use a stable x.y.z version. Current version is ${VERSION}."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Remote tag ${TAG} already exists."
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${TAG} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Macro ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify version state
        run: bun run version:check

      - name: Reject generated binaries
        run: bun run repo:check-binaries

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Audit i18n coverage
        run: bun run i18n:audit

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            key: macos
            runner: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: release-macos
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            key: windows
            runner: windows-latest
            args: --bundles nsis
            artifact_name: release-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            key: linux
            runner: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            artifact_name: release-linux
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        if: matrix.key != 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with macOS targets
        if: matrix.key == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify Apple signing secrets
        if: matrix.key == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS signing secret: ${name}"
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tauriScript: bun dev/tauri-cli.mjs
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: Verify macOS bundle
        if: matrix.key == 'macos'
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.app' -type d | head -n 1)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.dmg' -type f | head -n 1)"

          test -n "$APP_PATH"
          test -n "$DMG_PATH"

          bun ./dev/verify-macos-bundle.mjs --target universal-apple-darwin --app "$APP_PATH"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-assets

          copy_asset() {
            local pattern="$1"
            local destination="$2"
            local source
            source="$(find downloaded-artifacts -type f -name "$pattern" | sort | head -n 1)"
            if [ -z "$source" ]; then
              echo "::error::Missing release asset matching ${pattern}"
              find downloaded-artifacts -type f | sort
              exit 1
            fi
            cp "$source" "release-assets/${destination}"
          }

          copy_asset '*.dmg' "Macro_${VERSION}_macOS_universal.dmg"
          copy_asset '*.exe' "Macro_${VERSION}_Windows_x64_setup.exe"
          copy_asset '*.AppImage' "Macro_${VERSION}_Linux_x64.AppImage"
          copy_asset '*.deb' "Macro_${VERSION}_Linux_x64.deb"
          copy_asset '*.rpm' "Macro_${VERSION}_Linux_x64.rpm"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' || true)"

          {
            echo "## Downloads"
            echo
            echo "- macOS Apple Silicon + Intel: \`Macro_${VERSION}_macOS_universal.dmg\`"
            echo "- Windows x64: \`Macro_${VERSION}_Windows_x64_setup.exe\`"
            echo "- Linux x64: \`Macro_${VERSION}_Linux_x64.AppImage\`, \`Macro_${VERSION}_Linux_x64.deb\`, or \`Macro_${VERSION}_Linux_x64.rpm\`"
            echo "- Source code: GitHub automatically attaches source archives to this release."
            echo
            echo "## Checksums"
            echo
            echo "Download \`SHA256SUMS.txt\` to verify release assets."
            echo
            echo "## Changes"
            echo
            if [ -n "$GENERATED_NOTES" ]; then
              printf '%s\n' "$GENERATED_NOTES"
            else
              echo "GitHub release notes were not generated for this run."
            fi
          } > release-notes.md

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --draft \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
