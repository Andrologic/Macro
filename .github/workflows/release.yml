name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Restrict manual runs to main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run from main. Current ref is ${GITHUB_REF_NAME}."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify release version and availability
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(bun -e "console.log(require('./package.json').version)")"
          TAG="v${VERSION}"

          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Official releases must use a stable x.y.z version. Current version is ${VERSION}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the application version ${VERSION}."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Remote tag ${TAG} already exists. Create releases from their immutable tag instead."
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::GitHub release ${TAG} already exists."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Macro ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify version state
        run: bun run version:check

      - name: Reject generated binaries
        run: bun run repo:check-binaries

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Audit i18n coverage
        run: bun run i18n:audit

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            key: macos
            runner: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: release-macos
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64
            key: windows
            runner: windows-latest
            args: --bundles nsis
            artifact_name: release-windows
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux x64
            key: linux
            runner: ubuntu-22.04
            args: --bundles appimage,deb,rpm
            artifact_name: release-linux
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Rust stable
        if: matrix.key != 'macos'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with macOS targets
        if: matrix.key == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify Apple signing secrets
        if: matrix.key == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required macOS signing secret: ${name}"
              exit 1
            fi
          done

      - name: Write App Store Connect API key
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Configure Windows code signing
        if: matrix.key == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Missing required Windows code-signing secret.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'macro-codesign.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -Force $certificatePath

          if (-not $certificate.Thumbprint) {
            throw 'Unable to read the imported Windows certificate thumbprint.'
          }

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
              }
            }
          } | ConvertTo-Json -Depth 4 | Set-Content -Path src-tauri/tauri.windows.conf.json -Encoding utf8

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tauriScript: bun dev/tauri-cli.mjs
          args: ${{ matrix.args }}
          retryAttempts: 2
          uploadUpdaterJson: false

      - name: Verify macOS bundle
        if: matrix.key == 'macos'
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.app' -type d | head -n 1)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.dmg' -type f | head -n 1)"

          test -n "$APP_PATH"
          test -n "$DMG_PATH"

          bun ./dev/verify-macos-bundle.mjs --target universal-apple-darwin --app "$APP_PATH"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify Windows installer signature
        if: matrix.key == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer is missing.' }

          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer signature is not valid: $($signature.Status)"
          }

      - name: Inspect Linux packages
        if: matrix.key == 'linux'
        run: |
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)"
          RPM_PATH="$(find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"

          test -n "$APPIMAGE_PATH"
          test -n "$DEB_PATH"
          test -n "$RPM_PATH"
          test -x "$APPIMAGE_PATH"
          dpkg-deb --info "$DEB_PATH"
          dpkg-deb --contents "$DEB_PATH"
          rpm --query --list --package "$RPM_PATH"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  draft-release:
    permissions:
      contents: write
    name: Create draft release
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Collect release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-assets

          copy_asset() {
            local pattern="$1"
            local destination="$2"
            local source
            source="$(find downloaded-artifacts -type f -name "$pattern" | sort | head -n 1)"
            if [ -z "$source" ]; then
              echo "::error::Missing release asset matching ${pattern}"
              find downloaded-artifacts -type f | sort
              exit 1
            fi
            cp "$source" "release-assets/${destination}"
          }

          copy_asset '*.dmg' "Macro_${VERSION}_macOS_universal.dmg"
          copy_asset '*.exe' "Macro_${VERSION}_Windows_x64_setup.exe"
          copy_asset '*.AppImage' "Macro_${VERSION}_Linux_x64.AppImage"
          copy_asset '*.deb' "Macro_${VERSION}_Linux_x64.deb"
          copy_asset '*.rpm' "Macro_${VERSION}_Linux_x64.rpm"

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' || true)"

          {
            echo "## Downloads"
            echo
            echo "- macOS Apple Silicon + Intel: \`Macro_${VERSION}_macOS_universal.dmg\`"
            echo "- Windows x64: \`Macro_${VERSION}_Windows_x64_setup.exe\`"
            echo "- Linux x64: \`Macro_${VERSION}_Linux_x64.AppImage\`, \`Macro_${VERSION}_Linux_x64.deb\`, or \`Macro_${VERSION}_Linux_x64.rpm\`"
            echo "- Source code: GitHub automatically attaches source archives to this release."
            echo
            echo "## Checksums"
            echo
            echo "Download \`SHA256SUMS.txt\` to verify release assets."
            echo
            echo "## Changes"
            echo
            if [ -n "$GENERATED_NOTES" ]; then
              printf '%s\n' "$GENERATED_NOTES"
            else
              echo "GitHub release notes were not generated for this run."
            fi
          } > release-notes.md

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NAME: ${{ needs.validate.outputs.release_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --draft \
            --title "$RELEASE_NAME" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
