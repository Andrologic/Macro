name: Preview

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: Preview type
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - rc
      version:
        description: Required for RC, for example 0.2.0-rc.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate preview source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      pub_date: ${{ steps.meta.outputs.pub_date }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      kind: ${{ steps.meta.outputs.kind }}
    steps:
      - name: Check out develop and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Gate previews and derive version
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_KIND: ${{ inputs.kind || 'nightly' }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease >/tmp/stable-release.json || {
            echo "Preview publication remains disabled until stable v0.1.1 is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [[ "$(jq -r '.isDraft or .isPrerelease' /tmp/stable-release.json)" != "false" ]]; then
            echo "::error::v0.1.1 must be a published stable release before previews can start."
            exit 1
          fi

          SOURCE_SHA="$(git rev-parse HEAD)"
          KIND="$REQUESTED_KIND"
          if [[ "$KIND" != "nightly" && "$KIND" != "rc" ]]; then
            echo "::error::Unsupported preview type: ${KIND}"
            exit 1
          fi

          if [[ "$KIND" == "rc" ]]; then
            VERSION="$REQUESTED_VERSION"
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::RC version must use x.y.z-rc.n."
              exit 1
            fi
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            BASE_VERSION="${PACKAGE_VERSION%%-*}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            if [[ "$PACKAGE_VERSION" == *-* ]]; then
              NEXT_PATCH="$PATCH"
            else
              NEXT_PATCH="$((PATCH + 1))"
            fi
            STAMP="$(date -u +%Y%m%d)"
            VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-nightly.${STAMP}.${GITHUB_RUN_NUMBER}"
          fi

          PREVIOUS_SHA="$(gh release view preview --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null | sed -n 's/.*source-sha:\([0-9a-f]\{40\}\).*/\1/p' | head -n 1 || true)"
          if [[ "$EVENT_NAME" == "schedule" && "$KIND" == "nightly" && "$PREVIOUS_SHA" == "$SOURCE_SHA" ]]; then
            echo "develop has not changed since the last preview."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"

      - name: Install Linux native dependencies
        if: steps.meta.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Run shared validation profile
        if: steps.meta.outputs.publish == 'true'
        run: bun dev/ci/run-checks.mjs --profile native

      - name: Validate generated preview version
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bun dev/version/bump.mjs "$VERSION"
          bun dev/version/check.mjs

  build:
    name: Build preview ${{ matrix.name }}
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    environment: preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            key: macos
            runner: macos-15
            args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: preview-macos
            artifact_paths: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows x64
            key: windows
            arch: x64
            runner: windows-latest
            args: --bundles nsis
            artifact_name: preview-windows-x64
            bundle_dir: src-tauri/target/release/bundle/nsis
            main_binary: src-tauri/target/release/macro.exe
            sidecar_binary: src-tauri/binaries/macro-ai-runtime-x86_64-pc-windows-msvc.exe
            pe_machine: '0x8664'
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
          - name: Windows ARM64
            key: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            args: --target aarch64-pc-windows-msvc --bundles nsis
            artifact_name: preview-windows-arm64
            bundle_dir: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis
            main_binary: src-tauri/target/aarch64-pc-windows-msvc/release/macro.exe
            sidecar_binary: src-tauri/binaries/macro-ai-runtime-aarch64-pc-windows-msvc.exe
            pe_machine: '0xAA64'
            artifact_paths: |
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          - name: Linux x64
            key: linux
            runner: ubuntu-22.04
            args: --verbose --bundles appimage,deb,rpm
            artifact_name: preview-linux
            artifact_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    steps:
      - name: Check out validated develop commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        if: matrix.key != 'macos'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Set up Rust with macOS targets
        if: matrix.key == 'macos'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.key == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdk-pixbuf2.0-bin \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Apply preview version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bun dev/version/bump.mjs "$VERSION"

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - name: Verify Apple signing secrets
        if: matrix.key == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8 APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing macOS signing secret: ${name}"; exit 1; }
          done

      - name: Write App Store Connect API key
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build preview bundles
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          NO_STRIP: ${{ matrix.key == 'linux' && 'true' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun dev/tauri-cli.mjs
          args: ${{ matrix.args }}
          retryAttempts: 1
          uploadUpdaterJson: false

      - name: Verify macOS bundle and notarization
        if: matrix.key == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.app' -type d | head -n 1)"
          DMG_PATH="$(find src-tauri/target/universal-apple-darwin/release/bundle -maxdepth 3 -name '*.dmg' -type f | head -n 1)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          bun ./dev/verify-macos-bundle.mjs --target universal-apple-darwin --app "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNED_TEAM_ID="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -n 1)"
          test "$SIGNED_TEAM_ID" = "$APPLE_TEAM_ID"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify unsigned Windows installer
        if: matrix.key == 'windows'
        shell: pwsh
        env:
          WINDOWS_BUNDLE_DIR: ${{ matrix.bundle_dir }}
          MAIN_BINARY_PATH: ${{ matrix.main_binary }}
          SIDECAR_BINARY_PATH: ${{ matrix.sidecar_binary }}
          EXPECTED_PE_MACHINE: ${{ matrix.pe_machine }}
        run: |
          function Get-PeMachine([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "PE binary is missing: $Path"
            }
            $stream = [System.IO.File]::OpenRead($Path)
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4
              return ('0x{0:X4}' -f $reader.ReadUInt16())
            } finally {
              $stream.Dispose()
            }
          }

          foreach ($binary in @($env:MAIN_BINARY_PATH, $env:SIDECAR_BINARY_PATH)) {
            $machine = Get-PeMachine $binary
            if ($machine -ne $env:EXPECTED_PE_MACHINE) {
              throw "$binary has PE machine $machine; expected $env:EXPECTED_PE_MACHINE."
            }
          }

          $installer = Get-ChildItem -LiteralPath $env:WINDOWS_BUNDLE_DIR -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer is missing.' }
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Windows installer was expected to be unsigned, but its status is $($signature.Status)."
          }

      - name: Inspect Linux packages
        if: matrix.key == 'linux'
        run: |
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)"
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -type f -name '*.deb' | head -n 1)"
          RPM_PATH="$(find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' | head -n 1)"
          test -x "$APPIMAGE_PATH"
          dpkg-deb --info "$DEB_PATH"
          rpm --query --list --package "$RPM_PATH"

      - name: Upload preview artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish permanent Preview release
    needs:
      - validate
      - build
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: update-channel-publish
      cancel-in-progress: false
    steps:
      - name: Check out trusted release tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download preview artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded-artifacts

      - name: Collect versioned assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p release-assets
          copy_asset() {
            local artifact_directory="$1"
            local pattern="$2"
            local destination="$3"
            local source
            source="$(find "downloaded-artifacts/${artifact_directory}" -type f -name "$pattern" | sort | head -n 1)"
            test -n "$source" || { echo "::error::Missing preview asset matching ${artifact_directory}/${pattern}"; exit 1; }
            cp "$source" "release-assets/${destination}"
          }
          copy_asset preview-macos '*.dmg' "Macro_${VERSION}_macOS_universal.dmg"
          copy_asset preview-macos '*.app.tar.gz' "Macro_${VERSION}_macOS_universal.app.tar.gz"
          copy_asset preview-macos '*.app.tar.gz.sig' "Macro_${VERSION}_macOS_universal.app.tar.gz.sig"
          copy_asset preview-windows-x64 '*.exe' "Macro_${VERSION}_Windows_x64_setup.exe"
          copy_asset preview-windows-x64 '*.exe.sig' "Macro_${VERSION}_Windows_x64_setup.exe.sig"
          copy_asset preview-windows-arm64 '*.exe' "Macro_${VERSION}_Windows_ARM64_setup.exe"
          copy_asset preview-windows-arm64 '*.exe.sig' "Macro_${VERSION}_Windows_ARM64_setup.exe.sig"
          copy_asset preview-linux '*.AppImage' "Macro_${VERSION}_Linux_x64.AppImage"
          copy_asset preview-linux '*.AppImage.sig' "Macro_${VERSION}_Linux_x64.AppImage.sig"
          copy_asset preview-linux '*.deb' "Macro_${VERSION}_Linux_x64.deb"
          copy_asset preview-linux '*.rpm' "Macro_${VERSION}_Linux_x64.rpm"

      - name: Generate preview metadata
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PUB_DATE: ${{ needs.validate.outputs.pub_date }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          KIND: ${{ needs.validate.outputs.kind }}
        run: |
          {
            echo "Macro ${VERSION} is a validated ${KIND} build from develop."
            echo
            echo "Windows installers are not Authenticode-signed and may display an Unknown publisher warning."
            echo
            echo "<!-- source-sha:${SOURCE_SHA} -->"
          } > preview-notes.md

          bun dev/release/updater-manifest.mjs \
            --channel preview \
            --version "$VERSION" \
            --tag preview \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file preview-notes.md \
            --pub-date "$PUB_DATE" \
            --output release-assets/latest.json \
            --artifact windows-x86_64 "release-assets/Macro_${VERSION}_Windows_x64_setup.exe" "release-assets/Macro_${VERSION}_Windows_x64_setup.exe.sig" "Macro_${VERSION}_Windows_x64_setup.exe" \
            --artifact windows-aarch64 "release-assets/Macro_${VERSION}_Windows_ARM64_setup.exe" "release-assets/Macro_${VERSION}_Windows_ARM64_setup.exe.sig" "Macro_${VERSION}_Windows_ARM64_setup.exe" \
            --artifact linux-x86_64 "release-assets/Macro_${VERSION}_Linux_x64.AppImage" "release-assets/Macro_${VERSION}_Linux_x64.AppImage.sig" "Macro_${VERSION}_Linux_x64.AppImage" \
            --artifact darwin-x86_64 "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz" "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz.sig" "Macro_${VERSION}_macOS_universal.app.tar.gz" \
            --artifact darwin-aarch64 "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz" "release-assets/Macro_${VERSION}_macOS_universal.app.tar.gz.sig" "Macro_${VERSION}_macOS_universal.app.tar.gz"

          bun dev/release/channel-manifests.mjs \
            --manifest release-assets/latest.json \
            --channel preview \
            --output channel-output
          bun dev/release/verify-channel-manifests.mjs \
            --directory channel-output \
            --channel preview \
            --version "$VERSION" \
            --tag preview

          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          bun dev/release/verify-updater.mjs \
            --manifest release-assets/latest.json \
            --asset-root release-assets \
            --checksums release-assets/SHA256SUMS.txt

      - name: Create or update Preview release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          if gh release view preview >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/preview" \
              -f sha="$SOURCE_SHA" \
              -F force=true >/dev/null
            gh release edit preview --title "Macro Preview" --notes-file preview-notes.md --prerelease
          else
            gh release create preview --target "$SOURCE_SHA" --title "Macro Preview" --notes-file preview-notes.md --prerelease
          fi
          gh release upload preview release-assets/* --clobber

      - name: Advance preview channel pointers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" channel-repository
          bun dev/release/publish-channel-branch.mjs \
            --repository channel-repository \
            --manifests channel-output \
            --channel preview \
            --label "$VERSION"
