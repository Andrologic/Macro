name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run fast repository checks
        run: |
          bun run version:check
          bun run repo:check-binaries
          bun run typecheck
          bun run lint
          bun run i18n:audit

      - name: Run frontend tests
        run: bun run test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -- --test-threads=1

      - name: Check headless example
        run: cargo check --manifest-path src-tauri/Cargo.toml --example macro-headless --locked

      - name: Build frontend
        run: bun run build

      - name: Check bundle budgets
        run: bun run bundle:check
