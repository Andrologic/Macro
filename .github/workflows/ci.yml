name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - develop
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reusable_validation: ${{ steps.reuse.outputs.reusable || 'false' }}
      documentation_only: ${{ steps.changes.outputs.documentation_only }}
      frontend: ${{ steps.changes.outputs.frontend }}
      native: ${{ steps.changes.outputs.native }}
      sidecar: ${{ steps.changes.outputs.sidecar }}
      configuration: ${{ steps.changes.outputs.configuration }}
      linux: ${{ steps.changes.outputs.linux }}
      windows: ${{ steps.changes.outputs.windows }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Find successful validation already run on main
        id: reuse
        if: github.event_name == 'push' && github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node dev/ci/find-reusable-ci.mjs
          --workflow ci.yml
          --branch main
          --event push
          --sha "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: changes
        if: steps.reuse.outputs.reusable != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DIFF_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
        run: |
          CLASSIFIER="$RUNNER_TEMP/macro-classify-changes.mjs"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if ! git cat-file -e "${BASE_SHA}:dev/ci/classify-changes.mjs" 2>/dev/null; then
              # The first pull request introducing the classifier cannot trust
              # its own implementation. Run every validation conservatively.
              {
                echo "documentation_only=false"
                echo "frontend=true"
                echo "native=true"
                echo "sidecar=true"
                echo "configuration=true"
                echo "linux=true"
                echo "windows=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Pull requests must not control the program deciding which required
            # checks may be skipped. Always use the target branch's classifier.
            git show "${BASE_SHA}:dev/ci/classify-changes.mjs" > "$CLASSIFIER"
          else
            # Direct develop/main pushes already run trusted merged code.
            cp dev/ci/classify-changes.mjs "$CLASSIFIER"
          fi

          node "$CLASSIFIER" --base "$BASE_SHA" --head "$HEAD_SHA" --mode "$DIFF_MODE" --github-output "$GITHUB_OUTPUT"

  linux:
    name: Linux validation
    needs: classify
    if: needs.classify.outputs.reusable_validation != 'true' && needs.classify.outputs.linux == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore frontend dependency cache
        if: needs.classify.outputs.frontend == 'true' || needs.classify.outputs.sidecar == 'true' || needs.classify.outputs.configuration == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('package.json', 'bun.lock', 'bunfig.toml') }}

      - name: Install locked frontend dependencies
        if: needs.classify.outputs.frontend == 'true' || needs.classify.outputs.sidecar == 'true' || needs.classify.outputs.configuration == 'true'
        run: bun install --frozen-lockfile

      - name: Install Linux native dependencies
        if: needs.classify.outputs.native == 'true' || needs.classify.outputs.configuration == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Set up Rust
        if: needs.classify.outputs.native == 'true' || needs.classify.outputs.configuration == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Restore Rust build cache
        if: needs.classify.outputs.native == 'true' || needs.classify.outputs.configuration == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: native-tests
          save-if: ${{ github.event_name == 'push' }}

      - name: Run shared frontend validation profile
        if: needs.classify.outputs.frontend == 'true' && needs.classify.outputs.configuration != 'true'
        run: bun dev/ci/run-checks.mjs --profile frontend --skip-install

      - name: Run focused native validation profile
        if: needs.classify.outputs.native == 'true' && needs.classify.outputs.configuration != 'true'
        run: bun dev/ci/run-checks.mjs --profile native-core

      - name: Build changed AI runtime sidecar
        if: needs.classify.outputs.sidecar == 'true' && needs.classify.outputs.configuration != 'true'
        run: bun dev/ci/run-checks.mjs --profile sidecar --skip-install

      - name: Run conservative validation profile
        if: needs.classify.outputs.configuration == 'true'
        run: bun dev/ci/run-checks.mjs --profile native --skip-install

  windows:
    name: Windows native check
    needs: classify
    if: needs.classify.outputs.reusable_validation != 'true' && needs.classify.outputs.windows == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore frontend dependency cache
        if: needs.classify.outputs.sidecar == 'true' || needs.classify.outputs.configuration == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules
          key: frontend-${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('package.json', 'bun.lock', 'bunfig.toml') }}

      - name: Install locked frontend dependencies
        if: needs.classify.outputs.sidecar == 'true' || needs.classify.outputs.configuration == 'true'
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.95.0

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-check
          save-if: ${{ github.event_name == 'push' }}

      - name: Run focused Windows native profile
        if: needs.classify.outputs.configuration != 'true'
        run: bun dev/ci/run-checks.mjs --profile windows-core

      - name: Build changed Windows AI runtime sidecar
        if: needs.classify.outputs.sidecar == 'true' && needs.classify.outputs.configuration != 'true'
        run: bun dev/ci/run-checks.mjs --profile sidecar --skip-install

      - name: Run conservative Windows validation profile
        if: needs.classify.outputs.configuration == 'true'
        run: bun dev/ci/run-checks.mjs --profile windows --skip-install
