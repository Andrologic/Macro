name: Weekly Release

on:
  schedule:
    # Mondays at 08:17 UTC. GitHub schedules always use UTC.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce default branch for weekly releases
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "Weekly releases can only run from ${{ github.event.repository.default_branch }}, current ref is ${GITHUB_REF_NAME}."
          exit 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Bump weekly version
        run: bun run version:bump weekly

      - name: Verify version state
        run: bun run version:check

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Audit i18n coverage
        run: bun run i18n:audit

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: bun run build

      - name: Verify frontend bundle budget
        run: bun run bundle:check

      - name: Read release metadata
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          STAMP="${VERSION#*-weekly.}"
          STAMP="${STAMP%%.*}"
          HUMAN_DATE="${STAMP:0:4}-${STAMP:4:2}-${STAMP:6:2}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Weekly ${HUMAN_DATE} (${TAG})" >> "$GITHUB_OUTPUT"

      - name: Commit weekly version bump
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): weekly v${VERSION}"

      - name: Tag weekly release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: git tag "${TAG}"

      - name: Push version bump and tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git push origin HEAD:${GITHUB_REF_NAME}
          git push origin "${TAG}"

  publish-tauri:
    needs: prepare-release
    runs-on: macos-15
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and upload weekly release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ${{ needs.prepare-release.outputs.release_name }}
          releaseBody: 'Automated weekly prerelease.'
          releaseDraft: true
          prerelease: true
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify weekly bundle architecture and code signing
        run: |
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app' -maxdepth 3 | head -n 1)"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.dmg' -maxdepth 3 | head -n 1)"
          AI_RUNTIME_PATH="$(find "$APP_PATH/Contents/MacOS" -name 'macro-ai-runtime*' | head -n 1)"

          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          test -n "$AI_RUNTIME_PATH"

          file "$AI_RUNTIME_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

  publish-release:
    needs:
      - prepare-release
      - publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare-release.outputs.release_name }}
        run: gh release edit "${TAG}" --draft=false --prerelease --title "${RELEASE_NAME}"
