name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify version state
        run: bun run version:check

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Audit i18n coverage
        run: bun run i18n:audit

      - name: Run frontend tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: bun run build

      - name: Verify frontend bundle budget
        run: bun run bundle:check

      - name: Read release metadata
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=Macro ${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release tag when missing
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  build-release:
    needs: prepare-release
    runs-on: macos-15
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.prepare-release.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build and upload signed macOS release artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: ${{ needs.prepare-release.outputs.release_name }}
          releaseBody: 'Signed and notarized Apple Silicon release.'
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify bundle architecture and code signing
        run: |
          APP_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app' -maxdepth 3 | head -n 1)"
          DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.dmg' -maxdepth 3 | head -n 1)"
          AI_RUNTIME_PATH="$(find "$APP_PATH/Contents/MacOS" -name 'macro-ai-runtime*' | head -n 1)"

          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          test -n "$AI_RUNTIME_PATH"

          file "$AI_RUNTIME_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare-release.outputs.release_name }}
        run: gh release edit "${TAG}" --draft=false --title "${RELEASE_NAME}"
