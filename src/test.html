<!DOCTYPE html>
<html>
<head>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "@codemirror/state": "https://esm.sh/@codemirror/state",
    "@codemirror/view": "https://esm.sh/@codemirror/view",
    "codemirror": "https://esm.sh/codemirror",
    "@codemirror/merge": "https://esm.sh/@codemirror/merge"
  }
}
</script>
<style>
  .cm-content { padding: 12px 24px 16px 12px; }
  .cm-lineNumbers .cm-gutterElement { min-width: 3ch; padding-left: 8px; padding-right: 8px; }
</style>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MergeView } from '@codemirror/merge';
import { EditorState } from '@codemirror/state';
import { EditorView, basicSetup } from 'codemirror';

const App = () => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const original = `
const a = {
      id: "secure",
      label: "Security",
      title: "Secure by Design",
      description: "Your code stays local. Powered by Tauri with sandboxed execution.",
};
`;
    const modified = `
const a = {
      id: "secure",
      label: "Sécurité",
      title: "Sécurisé par conception",
      description: "Votre code reste local. Propulsé par Tauri avec exécution sandboxée",
};
`;
    const view = new MergeView({
      a: { doc: original, extensions: [basicSetup, EditorView.lineWrapping] },
      b: { doc: modified, extensions: [basicSetup, EditorView.lineWrapping] },
      parent: ref.current,
      gutter: true,
      highlightChanges: true
    });
    return () => view.destroy();
  }, []);
  return React.createElement('div', { ref, style: { height: '500px' } });
};

createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</head>
<body><div id="root"></div></body>
</html>
